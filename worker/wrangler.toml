# ElyWalk — Backend de confiance (100 % gratuit, Cloudflare Workers)
# ====================================================================
# Remplace les Cloud Functions Firebase (qui nécessitent le plan payant Blaze).
# Fournit :
#   - /verify-integrity     : attestation Play Integrity (F05)
#   - /ssv                  : [LEGACY] callback AdMob SSV (F05), inutilisé depuis
#                             le passage à Meta Audience Network
#   - /fcm/send             : envoi de push FCM protégé (F11)
#   - /cron/process-notifications : consommateur des jetons FCM (F11)
#   - /cron/process-payouts       : traitement de la file de retraits (F06)
#   - /cron/sync-release          : version publiée sur le Play Store → appRelease/current
#                                   (écran « mise à jour disponible » au démarrage)
#
# Déploiement : npx wrangler deploy  (voir README.md pour les secrets)

name = "elywalk-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Variables non sensibles (surchargeables). Les secrets se gèrent via wrangler.
[vars]
PACKAGE_NAME = "com.elysium.elywalk"

# Secrets à créer (voir README) :
#   wrangler secret put GOOGLE_APPLICATION_CREDENTIALS  (JSON du compte de service)
#   wrangler secret put API_SECRET                       (secret partagé /fcm/send)
#   wrangler secret put SSV_KEYS                         (clés publiques AdMob SSV)

# Tâches planifiées (gratuites, sans Cloud Functions)
#
# ⚠️ Cloudflare numérote les jours de 1 (dimanche) à 7 (samedi) : un `0` en
# cinquième champ est rejeté par l'API des schedules (« invalid cron string »,
# code 10100) et fait échouer **tout** le déploiement des déclencheurs. On écrit
# donc le jour en toutes lettres (SUN..SAT), accepté sans ambiguïté — et
# `src/index.ts` doit comparer `event.cron` à la chaîne exacte ci-dessous.
[triggers]
crons = [
  "*/5 * * * *",    # amis, retraits et changements/annulations d'événements
  "0 * * * *",      # file de retraits
  "15 */6 * * *",   # version publiée sur le Play Store → appRelease/current (écran de mise à jour)
  "*/10 * * * SUN", # dimanche : récapitulatif hebdomadaire (A9), par tranches de 8 comptes
]
