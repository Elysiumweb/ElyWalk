apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Signature de la version de production (facultative en local).
//
// Renseigner `android/keystore.properties` (jamais commité) :
//   storeFile=/chemin/vers/elywalk-upload.jks
//   storePassword=…
//   keyAlias=upload
//   keyPassword=…
// ou les variables d'environnement ELYWALK_STORE_FILE / ELYWALK_STORE_PASSWORD
// / ELYWALK_KEY_ALIAS / ELYWALK_KEY_PASSWORD (CI).
// Sans l'un ni l'autre, `bundleRelease` produit un AAB non signé (à signer
// ensuite dans Android Studio : Build > Generate Signed App Bundle).
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigning = { String propertyName, String envName ->
    def value = keystoreProperties[propertyName] ?: System.getenv(envName)
    return value?.toString()?.trim()
}

def releaseStoreFile = resolveSigning('storeFile', 'ELYWALK_STORE_FILE')
def releaseStorePassword = resolveSigning('storePassword', 'ELYWALK_STORE_PASSWORD')
def releaseKeyAlias = resolveSigning('keyAlias', 'ELYWALK_KEY_ALIAS')
def releaseKeyPassword = resolveSigning('keyPassword', 'ELYWALK_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.elysium.elywalk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.elysium.elywalk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.8.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Optimisation R8 exigée par Google Play : réduction du code
            // (arbres inatteignables supprimés), optimisation des classes
            // (inlining, fusion, propagation) et obscurcissement complet.
            // Sans cela, Play signale « Améliorez la mémoire et les performances
            // de votre appli avec l'optimisation R8 » et « Obscurcissement 1 % ».
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // `mapping.txt` (fichier de correspondance R8) est joint
            // automatiquement à l'AAB : il permet de décoder les traces de pile
            // reçues depuis Play Console. Le conserver hors du dépôt :
            //   app/android/app/build/outputs/mapping/release/mapping.txt
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Localisation fusionnée pour la sortie GPS en arrière-plan (service natif).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Régie publicitaire : Meta Audience Network (intégration directe, sans
    // plateforme de médiation). Voir MetaAdsPlugin.java.
    implementation "com.facebook.android:audience-network-sdk:$audienceNetworkVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
