apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Version de l'application : une seule source de vérité, `app/package.json`.
// Play Console refuse une mise à jour dont le `versionCode` n'a pas augmenté :
// le code est donc dérivé automatiquement de la version sémantique
// (2.1.4 -> 20104) au lieu d'être saisi deux fois.
// ---------------------------------------------------------------------------
def packageJsonFile = new File(rootProject.projectDir, '../../package.json')
def appVersionName = '2.1.4'
def appVersionCode = 20104
try {
    def pkg = new groovy.json.JsonSlurper().parse(packageJsonFile)
    if (pkg.version) {
        def parts = pkg.version.toString().tokenize('.-')
        def major = parts.size() > 0 ? parts[0].toInteger() : 0
        def minor = parts.size() > 1 ? parts[1].toInteger() : 0
        def patch = parts.size() > 2 ? parts[2].toInteger() : 0
        appVersionName = pkg.version.toString()
        appVersionCode = major * 10000 + minor * 100 + patch
    }
} catch (Exception e) {
    logger.warn("package.json illisible, version Android par défaut ${appVersionName} (${appVersionCode}) : ${e.message}")
}

android {
    namespace = "com.elysium.elywalk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.elysium.elywalk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    // Unity LevelPlay et ses adaptateurs sont publiés sur Maven Central.
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Localisation fusionnée pour la sortie GPS en arrière-plan (service natif).
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // --- Unity LevelPlay (médiation) -------------------------------------
    // LevelPlay arbitre les enchères.
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.7.0'
    implementation 'com.unity3d.ads-mediation:facebook-adapter:5.7.0'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.16.0'
    implementation 'com.unity3d.ads-mediation:admob-adapter:5.19.0'
    // Identifiants publicitaires lus par LevelPlay (GAID + App Set ID).
    implementation 'com.google.android.gms:play-services-appset:16.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
