apply plugin: 'com.android.application'

android {
    namespace = "com.elysium.elywalk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.elysium.elywalk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 210
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Localisation fusionnée pour la sortie GPS en arrière-plan (service natif).
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ------------------------------------------------------------------
    // Publicité : Chartboost Mediation (médiation) → Meta Audience Network
    // https://developers.facebook.com/documentation/audience-network/bidding/partner-mediation/chartboost
    //
    // Exigences Meta pour cette médiation :
    //   • SDK Audience Network ≥ 6.21.0  → 6.22.0 ;
    //   • Chartboost Mediation ≥ 2.0.0   → 5.4.0 (branche 5.x courante,
    //     initialisée par Chartboost Core) ;
    //   • formats supportés : Interstitial + Rewarded (bidding uniquement).
    // ------------------------------------------------------------------
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.facebook.android:audience-network-sdk:6.22.0'
    // Identifiant publicitaire (AAID) : requis par les SDK Meta et Chartboost.
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    // Identifiant d'ensemble d'applications : requis par Chartboost Core.
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-base:18.7.2'

    // Chartboost Core + Mediation.
    implementation 'com.chartboost:chartboost-core-sdk:1.1.0'
    implementation 'com.chartboost:chartboost-mediation-sdk:5.4.0'
    // Adaptateurs des deux réseaux réellement configurés :
    //   • Meta Audience Network (revendeur de l'inventaire depuis 2.1.0) ;
    //   • Chartboost (réseau de la médiation, peut remplir une location).
    implementation 'com.chartboost:chartboost-mediation-adapter-meta-audience-network:5.6.22.0.0'
    implementation 'com.chartboost:chartboost-mediation-adapter-chartboost:5.9.14.0.0'

    // Dépendances tierces exigées par Chartboost Core.
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
