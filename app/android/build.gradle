// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Chartboost Mediation + Chartboost Core : dépôts JFrog officiels
        // (aucun de ces artefacts n'est publié sur Maven Central).
        maven {
            name "Chartboost Mediation's maven repo"
            url "https://cboost.jfrog.io/artifactory/chartboost-mediation"
        }
        maven {
            name "Chartboost Core's maven repo"
            url "https://cboost.jfrog.io/artifactory/chartboost-core"
        }
        // Chartboost Ads (SDK publicitaire) : requis par l'adaptateur et
        // éventuellement par la location Chartboost elle-même.
        maven {
            name "Chartboost Ads maven repo"
            url "https://cboost.jfrog.io/artifactory/chartboost-ads/"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
