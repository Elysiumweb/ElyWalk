# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ---------------------------------------------------------------------------
# Mémoire du daemon Gradle
# ---------------------------------------------------------------------------
# La valeur historique (1536 Mo) ne suffit plus : AGP 8.13, compileSdk 36 et une
# dizaine de modules Capacitor compilés depuis `node_modules` (dont
# `capacitor-local-notifications`) dépassent ce plafond. Quand la mémoire
# manque, la compilation Kotlin échoue **avant** de produire un message clair.
# Le metaspace est plafonné explicitement pour éviter qu'une fuite de classes
# (rechargement de plugins) ne fasse grossir le processus sans limite.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Compilation Kotlin : dans le processus Gradle, sans daemon séparé
# ---------------------------------------------------------------------------
# Symptôme visé : « The daemon has terminated unexpectedly on startup attempt
# #1 with error code: 0 », précédé de « Kotlin compile daemon is ready » — le
# daemon Kotlin démarre, annonce qu'il est prêt, puis sort proprement sans rien
# compiler (Windows + JDK 21/22 + Kotlin 2.x). Avec cette stratégie, aucun second
# JVM n'est lancé : la compilation se fait dans le daemon Gradle, qui est déjà
# dimensionné ci-dessus et dont les erreurs sont remontées normalement.
kotlin.compiler.execution.strategy=in-process

# Pour revenir au daemon Kotlin (builds incrémentaux plus rapides) une fois le
# JDK aligné : commenter la ligne `kotlin.compiler.execution.strategy` ci-dessus
# et décommenter la suivante.
# kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
