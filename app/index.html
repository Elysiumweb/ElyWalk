<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/elywalk-logo.png" />
    <!--
      Zoom autorisé (D05) : `maximum-scale=1` + `user-scalable=no` empêchaient
      tout agrandissement du texte, ce qui rendait l'application inutilisable
      pour les personnes ayant besoin d'une police plus grande (WCAG 1.4.4).
      Les champs de saisie utilisent 16 px minimum, donc iOS ne zoome pas
      involontairement au focus.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>ElyWalk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
